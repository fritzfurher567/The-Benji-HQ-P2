<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fisher Terminal</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0c0e; color: #f0f2f5; padding: 40px; margin: 0; }
        .wrapper { max-width: 500px; margin: 0 auto; background: #141619; border: 1px solid #22252a; border-radius: 6px; padding: 32px; }
        h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px 0; color: #ffffff; }
        .subtitle { font-size: 13px; color: #707782; margin-bottom: 24px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #b1b8c4; text-transform: uppercase; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; background: #0b0c0e; border: 1px solid #2c3036; border-radius: 4px; color: #ffffff; font-size: 14px; margin-bottom: 20px; }
        .calc-panel { background: #0b0c0e; border: 1px solid #2c3036; border-radius: 4px; padding: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; font-size: 14px; }
        .submit-btn { width: 100%; padding: 14px; border: none; border-radius: 4px; background: #ff6a00; color: #ffffff; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; text-transform: uppercase; }
        .submit-btn:hover { background: #e05d00; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2>Fisher Terminal</h2>
        <div class="subtitle">Log caught Tuna totals to generate verification data tickets.</div>

        <label>Tuna Quantity</label>
        <input type="number" id="tunaCount" min="1" placeholder="0" oninput="updatePayoutCalc()">

        <div class="calc-panel">
            <span>Estimated Compensation (200p / unit)</span>
            <span id="payoutDisplay" style="color: #ff6a00; font-weight: 600;">0p</span>
        </div>

        <button class="submit-btn" onclick="submitTicket()">Generate Ticket</button>
    </div>

    <script src="../api.js"></script>
    <script>
        function updatePayoutCalc() {
            const count = parseInt(document.getElementById('tunaCount').value) || 0;
            document.getElementById('payoutDisplay').innerText = `${(count * 200).toLocaleString()}p`;
        }
        function submitTicket() {
            const count = parseInt(document.getElementById('tunaCount').value);
            if (!count || count <= 0) return alert("Enter a valid tuna quantity.");
            alert("Fishing log entry successfully sent to verification queue.");
        }
    </script>
</body>
</html>
