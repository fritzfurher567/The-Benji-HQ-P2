<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales Desk</title>
    <style>
        body { background: #0b0c0e; color: #f0f2f5; font-family: sans-serif; padding: 40px; }
        .wrapper { max-width: 500px; margin: 0 auto; background: #141619; border: 1px solid #22252a; border-radius: 8px; padding: 30px; position: relative; }

        /* Connection Dot & Tooltip */
        .status-container { position: absolute; top: 32px; right: 32px; display: flex; align-items: center; }
        .status-dot { width: 14px; height: 14px; border-radius: 50%; background: #28a745; cursor: help; position: relative; transition: background 0.3s; }
        .status-dot.offline { background: #dc3545; }
        .tooltip { visibility: hidden; width: 220px; background-color: #22252a; color: #fff; text-align: center; padding: 8px; border-radius: 6px; position: absolute; z-index: 1; top: -10px; right: 25px; font-size: 12px; border: 1px solid #2c3036; opacity: 0; transition: opacity 0.3s; }
        .status-dot:hover .tooltip { visibility: visible; opacity: 1; }

        h2 { font-size: 20px; color: #ffffff; margin-top: 0; }
        label { font-size: 14px; color: #a0a5b0; margin-bottom: 5px; display: block; }
        input { width: 100%; padding: 12px; background: #0b0c0e; border: 1px solid #2c3036; color: #ffffff; border-radius: 4px; box-sizing: border-box; margin-bottom: 15px; }

        /* Quick Buy Row */
        .quick-buy-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .quick-btn { flex: 1; background: #0b0c0e; color: #ffffff; border: 1px solid #2c3036; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .quick-btn:hover { background: #2c3036; }

        .pricing-box { background: #0b0c0e; border: 1px solid #2c3036; padding: 12px; margin-bottom: 20px; border-radius: 6px; }
        .tip-text { font-size: 12px; color: #28a745; margin-top: -10px; margin-bottom: 20px; display: block; }

        .total-display { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .total-amount { color: #ff6a00; font-size: 24px; font-weight: 700; }
        .buy-btn { width: 100%; padding: 14px; background: #ff6a00; border: none; color: #ffffff; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .buy-btn:hover { background: #e65f00; }

        /* Receipt Box & Copy Button */
        #receipt-box { display: none; margin-top: 25px; padding: 20px; background: #0b0c0e; border: 1px dashed #2c3036; border-radius: 6px; }
        .receipt-title { color: #ff6a00; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .receipt-line { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; color: #a0a5b0; }
        .receipt-code { font-family: monospace; color: #ffffff; font-size: 16px; text-align: center; margin-top: 15px; display: flex; justify-content: center; align-items: center;}

        #copy-btn { background-color: #2c3036; color: #a0a5b0; border: 1px solid #a0a5b0; padding: 4px 8px; margin-left: 10px; border-radius: 4px; cursor: pointer; font-size: 11px; transition: 0.2s; }
        #copy-btn:hover { background-color: #ff6a00; color: #ffffff; border-color: #ff6a00; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="status-container">
        <div class="status-dot" id="connection-dot">
            <span class="tooltip" id="tooltip-text">🟢 Green: Online & connected to server.<br>🔴 Red: Offline.</span>
        </div>
    </div>

    <h2>Process Order</h2>

    <label>Quantity</label>
    <div class="quick-buy-row">
        <button type="button" class="quick-btn" onclick="setQuantity(10)">10x</button>
        <button type="button" class="quick-btn" onclick="setQuantity(25)">25x</button>
        <button type="button" class="quick-btn" onclick="setQuantity(55)">55x</button>
    </div>
    <input type="number" id="qty" placeholder="Enter amount..." oninput="calculateTotal()" min="1">

    <div class="pricing-box">
        <div style="font-size: 13px; color: #a0a5b0;">Base Price: 350p / item</div>
        <div style="font-size: 13px; color: #ff6a00; font-weight: bold; margin-top: 4px;">Bulk (55+): 300p / item</div>
    </div>

    <label>Tip Amount</label>
    <input type="number" id="tip" placeholder="Optional tip in points..." oninput="calculateTotal()" min="0">
    <span class="tip-text">Fixed point amount, no math required.</span>

    <div class="total-display">
        <span>Total Due:</span>
        <span class="total-amount" id="display-total">0p</span>
    </div>

    <button class="buy-btn" onclick="processOrder()">Buy Benjis</button>

    <div id="receipt-box">
        <div class="receipt-title">ORDER SUMMARY</div>
        <div class="receipt-line"><span>Items:</span> <span id="rec-qty">0</span></div>
        <div class="receipt-line"><span>Unit Price:</span> <span id="rec-price">0p</span></div>
        <div class="receipt-line"><span>Tip:</span> <span id="rec-tip">0p</span></div>
        <hr style="border-color: #2c3036; margin: 10px 0;">
        <div class="receipt-line"><span style="color:#fff; font-weight:bold;">Final Total:</span> <span id="rec-total" style="color:#ff6a00; font-weight:bold;">0p</span></div>

        <div class="receipt-code">
            <span id="receipt-order-code">ORD-XXXXX</span>
            <button type="button" id="copy-btn" onclick="copyOrderCode()">Copy</button>
        </div>
    </div>
</div>

<script>
    // --- LIVE CONNECTION CHECKER ---
    async function checkConnection() {
        const dot = document.getElementById('connection-dot');
        try {
            const response = await fetch('http://localhost:3000/status');
            if (response.ok) { dot.classList.remove('offline'); }
            else { dot.classList.add('offline'); }
        } catch (error) { dot.classList.add('offline'); }
    }
    checkConnection();
    setInterval(checkConnection, 5000);

    // --- QUICK BUY BUTTONS ---
    function setQuantity(amount) {
        document.getElementById('qty').value = amount;
        calculateTotal();
    }

    // --- MATH LOGIC ---
    function calculateTotal() {
        let qty = parseInt(document.getElementById('qty').value) || 0;
        let tip = parseInt(document.getElementById('tip').value) || 0;

        let unitPrice = qty >= 55 ? 300 : 350;
        let subtotal = qty * unitPrice;
        let total = subtotal + tip;

        document.getElementById('display-total').innerText = total.toLocaleString() + "p";
        return { qty, tip, unitPrice, total };
    }

    // --- ORDER PROCESSING & LOGGING TO BACKEND ---
    async function processOrder() {
        const orderData = calculateTotal();
        if (orderData.qty <= 0) { alert("Please enter a quantity!"); return; }

        const orderCode = "ORD-" + Math.floor(10000 + Math.random() * 90000);

        // Update Receipt UI
        document.getElementById('rec-qty').innerText = orderData.qty;
        document.getElementById('rec-price').innerText = orderData.unitPrice + "p";
        document.getElementById('rec-tip').innerText = orderData.tip + "p";
        document.getElementById('rec-total').innerText = orderData.total.toLocaleString() + "p";
        document.getElementById('receipt-order-code').innerText = orderCode;
        document.getElementById('receipt-box').style.display = 'block';

        // Send data to api.js to trigger the Discord Bot & Save the Log File
        try {
            await fetch('http://localhost:3000/submit-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    orderCode: orderCode,
                    quantity: orderData.qty,
                    tip: orderData.tip,
                    total: orderData.total
                })
            });
        } catch (err) {
            console.log("Could not reach server to log order. Receipt generated locally.");
        }
    }

    // --- COPY BUTTON LOGIC ---
    function copyOrderCode() {
        const codeText = document.getElementById('receipt-order-code').innerText;
        navigator.clipboard.writeText(codeText).then(() => {
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.innerText = "Copied!";
            setTimeout(() => { copyBtn.innerText = "Copy"; }, 2000);
        });
    }
</script>
</body>
</html>
