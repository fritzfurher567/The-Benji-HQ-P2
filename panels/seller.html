<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benji HQ | Seller Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #09090b; color: #f4f4f5; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 260px; background: #18181b; border-right: 1px solid #27272a; display: flex; flex-direction: column; padding: 24px 0; }
    .nav-menu { display: flex; flex-direction: column; gap: 8px; padding: 0 16px; flex-grow: 1; }
    .nav-btn { background: transparent; border: none; color: #a1a1aa; text-align: left; padding: 12px 16px; border-radius: 6px; cursor: pointer; font-weight: 700; }
    .nav-btn:hover { background: #27272a; color: #fff; }
    .nav-btn.active { background: #27272a; color: #f97316; }
    .employee { padding: 20px 16px; border-top: 1px solid #27272a; }
    .btn { border: none; border-radius: 6px; padding: 10px 12px; cursor: pointer; font-weight: 700; }
    .btn-muted { background: #27272a; color: #a1a1aa; border: 1px solid #3f3f46; }

    .main { flex: 1; padding: 30px; overflow-y: auto; }
    .view { display: none; }
    .view.active { display: block; }
    .card { background: #141619; border: 1px solid #22252a; border-radius: 8px; padding: 22px; margin-bottom: 16px; }
    .title { font-size: 34px; font-weight: 900; margin-bottom: 8px; color: #fff; }
    .sub { color: #a1a1aa; margin-bottom: 16px; }

    table { width: 100%; border-collapse: collapse; background: #0b0c0e; border-radius: 6px; overflow: hidden; }
    th, td { padding: 12px; border-bottom: 1px solid #27272a; color: #a1a1aa; font-size: 13px; text-align: left; }
    th { color: #f97316; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
    input, select {
      width: 100%; background: #09090b; border: 1px solid #3f3f46; color: #fff;
      border-radius: 4px; padding: 8px; outline: none;
    }
    .stock-number { text-align: center; font-size: 90px; font-weight: 900; color: #f97316; text-shadow: 0 0 40px rgba(249,115,22,.4); }
    .badge { padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .b-pending { background: rgba(234,179,8,.14); color: #eab308; }
    .b-progress { background: rgba(59,130,246,.14); color: #60a5fa; }
    .b-done { background: rgba(34,197,94,.14); color: #22c55e; }
    .sidebar-logo-wrap{
  padding: 0 16px 16px;
  margin: 0 0 14px;
  border-bottom: 1px solid #27272a;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.sidebar-logo-text{
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:1;
}
.logo-benji{
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
  color:#fff;
  text-transform:uppercase;
}
.logo-hq{
  font-size:36px;
  font-weight:900;
  letter-spacing:4px;
  color:#f97316;
  text-transform:uppercase;
  text-shadow:0 0 20px rgba(249,115,22,0.4);
}
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo-wrap">
  <img class="sidebar-logo-img" src="../The%20Benji%20HQ%20V2.png" alt="The Benji HQ V2">
  <div class="sidebar-logo-ver">Community Hub v2.0</div>
  <div class="sidebar-panel-name">Seller Panel</div>
</div>

    <div class="nav-menu">
      <button class="nav-btn active" onclick="switchTab('orders', this)">📝 Active Orders</button>
      <button class="nav-btn" onclick="switchTab('stock', this)">📦 Benji Stock</button>
    </div>
    <div class="employee">
      <div style="font-size:11px;color:#71717a;text-transform:uppercase;font-weight:700;">Logged In As</div>
      <div id="sellerName" style="color:#fff;font-weight:700;margin:6px 0 10px;">Loading...</div>
      <button class="btn btn-muted" onclick="logout()">LOG OUT</button>
    </div>
  </aside>

  <main class="main">
    <section id="orders" class="view active">
      <div class="card">
        <div class="title">ACTIVE ORDERS</div>
        <div class="sub">Order pipeline: Order Received → Making Order → Order Done</div>
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Method</th>
              <th>Qty</th>
              <th>Tip</th>
              <th>Total</th>
              <th>Meetup</th>
              <th>Seller</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </section>

    <section id="stock" class="view">
      <div class="card">
        <div class="title">BENJI STOCK</div>
        <div class="sub">Global stock set by Owner panel.</div>
        <div id="stockNumber" class="stock-number">0</div>
      </div>
    </section>
  </main>

  <script>
    const API_URL = "/.netlify/functions/api";
    let activeWorker = null;

    async function api(action, payload = {}) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, ...payload })
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || "Request failed");
      return data;
    }

    function switchTab(id, btn) {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(n => n.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      btn.classList.add("active");
      if (id === "stock") loadStock();
    }

    function logout() {
      localStorage.removeItem("benji_active_worker");
      window.location.href = "../front side/index.html";
    }

    function statusBadge(status) {
      if (status === "order_done") return `<span class="badge b-done">Order Done</span>`;
      if (status === "making_order") return `<span class="badge b-progress">Making Order</span>`;
      return `<span class="badge b-pending">Order Received</span>`;
    }

    async function loadOrders() {
      try {
        const r = await api("listOrders");
        const body = document.getElementById("ordersBody");
        body.innerHTML = "";

        const rows = r.orders.filter(o => o.status !== "order_done");
        if (!rows.length) {
          body.innerHTML = `<tr><td colspan="9" style="text-align:center;">No active orders.</td></tr>`;
          return;
        }

        rows.forEach(o => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td style="color:#fff;font-weight:700;">${o.id}</td>
            <td style="color:#60a5fa;">${o.customer_discord || "-"}</td>
            <td>${o.payment_method || "-"}</td>
            <td>${o.qty}x</td>
            <td>${o.tip}p</td>
            <td style="color:#f97316;font-weight:700;">${Number(o.total).toLocaleString()}p</td>
            <td><input value="${o.meetup || ""}" placeholder="Location..." onblur="saveMeetup('${o.id}', this.value)" /></td>
            <td>${o.seller || "Pending"}</td>
            <td>
              <select onchange="changeStatus('${o.id}', this.value)">
                <option value="order_received" ${o.status==="order_received"?"selected":""}>Order Received</option>
                <option value="making_order" ${o.status==="making_order"?"selected":""}>Making Order</option>
                <option value="order_done" ${o.status==="order_done"?"selected":""}>Order Done</option>
              </select>
              <div style="margin-top:6px;">${statusBadge(o.status)}</div>
            </td>
          `;
          body.appendChild(tr);
        });
      } catch (e) {
        document.getElementById("ordersBody").innerHTML = `<tr><td colspan="9" style="text-align:center;color:#ef4444;">${e.message}</td></tr>`;
      }
    }

    async function changeStatus(orderId, status) {
      try {
        await api("updateOrderStatus", {
          orderId,
          status,
          seller: activeWorker.username || "Seller"
        });
        await loadOrders();
      } catch (e) {
        alert(e.message);
      }
    }

    async function saveMeetup(orderId, meetup) {
      try {
        await api("updateOrderMeetup", { orderId, meetup });
      } catch (e) {
        alert(e.message);
      }
    }

    async function loadStock() {
      try {
        const r = await api("getStock");
        document.getElementById("stockNumber").innerText = Number(r.stock || 0).toLocaleString();
      } catch (e) {
        document.getElementById("stockNumber").innerText = "0";
      }
    }

    function bootAuth() {
      activeWorker = JSON.parse(localStorage.getItem("benji_active_worker") || "null");
      if (!activeWorker || !["Seller", "Management", "Owner"].includes(activeWorker.role)) {
        window.location.href = "../front side/index.html";
        return;
      }
      document.getElementById("sellerName").innerText = activeWorker.username || activeWorker.role;
    }

    window.onload = async () => {
      bootAuth();
      await loadOrders();
      await loadStock();
      setInterval(loadOrders, 5000);
    };
  </script>
</body>
</html>
