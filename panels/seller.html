<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0c0e; color: #f0f2f5; padding: 40px; margin: 0; }
        .wrapper { max-width: 500px; margin: 0 auto; background: #141619; border: 1px solid #22252a; border-radius: 6px; padding: 32px; }
        h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px 0; color: #ffffff; }
        .subtitle { font-size: 13px; color: #707782; margin-bottom: 24px; }

        label { display: block; font-size: 12px; font-weight: 600; color: #b1b8c4; text-transform: uppercase; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; background: #0b0c0e; border: 1px solid #2c3036; border-radius: 4px; color: #ffffff; font-size: 14px; margin-bottom: 20px; }

        .pricing-box { background: #0b0c0e; border: 1px solid #2c3036; border-radius: 4px; padding: 16px; margin-bottom: 24px; font-size: 13px; color: #707782; }
        .total-display { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .total-amount { color: #ff6a00; font-size: 24px; font-weight: 700; }

        .buy-btn { width: 100%; padding: 14px; border: none; border-radius: 4px; background: #ff6a00; color: #ffffff; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; text-transform: uppercase; }
        .buy-btn:hover { background: #e05d00; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2>Sales Desk</h2>
        <div class="subtitle">Standardized Benji wholesale dispatch terminal.</div>

        <label>Quantity</label>
        <input type="number" value="10" readonly>

        <div class="pricing-box">
            Base Unit: 350p<br>
            Bulk Rate (55+): 300p (10% Discount)
        </div>

        <div class="total-display">
            <span>Total Due</span>
            <span class="total-amount">3,500p</span>
        </div>

        <button class="buy-btn">Buy Benjis</button>
    </div>
</body>
</html>
