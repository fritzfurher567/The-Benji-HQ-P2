<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seller Ticket Manager</title>
    <style>
        body { background: #0b0c0e; color: #f0f2f5; font-family: sans-serif; padding: 40px; }
        .wrapper { max-width: 500px; margin: 0 auto; background: #141619; border: 1px solid #22252a; border-radius: 8px; padding: 30px; }
        h2 { font-size: 20px; color: #ffffff; margin-bottom: 20px; border-bottom: 1px solid #22252a; padding-bottom: 10px; }
        label { font-size: 14px; color: #a0a5b0; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 12px; background: #0b0c0e; border: 1px solid #2c3036; color: #ffffff; border-radius: 4px; margin-bottom: 15px; }
        .action-btn { width: 100%; padding: 14px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-done { background: #28a745; color: white; }
        .btn-done:hover { background: #218838; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>Manage Ticket</h2>

    <label>Ticket ID (from Discord)</label>
    <input type="text" id="ticketId" placeholder="e.g. ORD-12345">

    <label>Client Username</label>
    <input type="text" id="clientName" placeholder="Username...">

    <label>Meeting Location / Instructions</label>
    <input type="text" id="meetingPlace" placeholder="e.g. World 2, Spawn...">

    <label>Status</label>
    <select id="ticketStatus">
        <option value="Processing">Processing</option>
        <option value="Completed">Completed / Exchanged</option>
    </select>

    <button class="action-btn btn-done" onclick="completeTicket()">Mark As Done</button>
</div>

<script>
    // Your main webhook (Keep this here just in case)
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1519403301374787666/CDzN1oODxyQA4zQeCidemB58d4bjVwtFU8XfCPZwW4zBlnuhjKmXSDt7oyZ7GYhBjdxJ";

    // 👉 PASTE YOUR NEW STATUS CHANNEL WEBHOOK HERE 👈
    const STATUS_WEBHOOK_URL = "https://discord.com/api/webhooks/1520094625648480260/2ghP8XJXJsHemv5mMUpI7or2vT-w3GQQJIj4ftJCqLLpGEL0lAf_HMzPmFMOxyDTtpTW";

    async function completeTicket() {
        const ticketId = document.getElementById('ticketId').value;
        const clientName = document.getElementById('clientName').value;
        const meetingPlace = document.getElementById('meetingPlace').value;
        const status = document.getElementById('ticketStatus').value;

        if (!ticketId || !meetingPlace) {
            alert("Please fill in the Ticket ID and Meeting Place.");
            return;
        }

        // Payload for the Seller updating the ticket
        const payload = {
            embeds: [{
                title: "✅ Ticket Updated",
                color: status === "Completed" ? 0x28a745 : 0xfacc15, // Green if done, Yellow if processing
                fields: [
                    { name: "Ticket ID", value: ticketId, inline: true },
                    { name: "Customer", value: clientName, inline: true },
                    { name: "Meeting Place", value: meetingPlace, inline: false },
                    { name: "Status", value: `**${status}**`, inline: true }
                ]
            }]
        };

        try {
            // This now sends exclusively to your STATUS_WEBHOOK_URL
            await fetch(STATUS_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert("Ticket updated and notification sent to the status channel!");

            // Clear inputs
            document.getElementById('ticketId').value = '';
            document.getElementById('meetingPlace').value = '';
        } catch (err) {
            console.error("Webhook failed:", err);
            alert("Failed to update ticket.");
        }
    }
</script>
</script>
</script>
</body>
</html>
