<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farmer Terminal - Benji HQ</title>
    <style>
        body { background: #121214; color: #e1e1e6; font-family: sans-serif; padding: 40px; }
        .container { max-width: 500px; background: #202024; padding: 30px; border-radius: 8px; margin: 0 auto; }
        input, select { width: 100%; padding: 12px; margin: 10px 0 20px 0; border-radius: 4px; border: 1px solid #4d4d57; background: #121214; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; background: #2a9d8f; color: #fff; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #264653; }
        .calc-view { background: #121214; padding: 15px; border-radius: 4px; text-align: center; margin-bottom: 20px; font-weight: bold; border-left: 4px solid #2a9d8f; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🧑‍🌾 Farmer Terminal</h2>
        <p style="color: #8d8d99;">Select your crop layout and log delivery batches below.</p>

        <label>Crop Type:</label>
        <select id="vegType">
            <option value="Beans">🫘 Beans</option>
            <option value="Peppers">🫑 Peppers</option>
        </select>

        <label>Crop Amount:</label>
        <input type="number" id="cropCount" min="1" placeholder="Enter amount..." oninput="calculatePayout()">

        <div class="calc-view">
            Estimated Payout: <span id="payoutDisplay" style="color: #00b37e;">0</span>p
        </div>

        <button onclick="submitFarmerTicket()">Generate Management Ticket</button>
    </div>

    <script src="../api.js"></script>
    <script>
        function calculatePayout() {
            const count = parseInt(document.getElementById('cropCount').value) || 0;
            // 5,000 per 200 items breaks down perfectly to 25p per item
            document.getElementById('payoutDisplay').innerText = (count * 25).toLocaleString();
        }

        async function submitFarmerTicket() {
            const type = document.getElementById('vegType').value;
            const count = parseInt(document.getElementById('cropCount').value);
            if (!count || count <= 0) return alert("Please enter a valid crop amount!");

            alert(`Ticket generated successfully for ${count} ${type}! Total bulk payout request value: ${count * 25}p.`);
        }
    </script>
</body>
</html>
