<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Benji HQ | Manager Terminal</title>
    <style>
        body { background: #09090b; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; }
        .top-navbar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: #0a0a0a; border-bottom: 2px solid #f97316; display: flex; align-items: center; padding: 0 30px; z-index: 1000; }
        .logo-text { color: white; font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; }
        .sidebar { position: fixed; top: 70px; left: 0; width: 250px; height: calc(100vh - 70px); background: #141619; border-right: 1px solid #27272a; padding: 20px; }
        .nav-item { display: block; padding: 15px; color: #a1a1aa; text-decoration: none; font-weight: bold; border-radius: 4px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .nav-item:hover { background: #18181b; color: #fff; }
        .nav-item.active { background: #f97316; color: #000; }
        .main-content { margin-top: 70px; margin-left: 250px; padding: 40px; width: 100%; max-width: 800px; }
        .admin-box { background: #141619; border: 1px solid #27272a; padding: 25px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #f97316; margin-bottom: 8px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; background: #0b0c0e; border: 1px solid #3f3f46; color: white; border-radius: 4px; margin-bottom: 15px; }
        .btn { background: #f97316; color: #000; padding: 12px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <header class="top-navbar"><div class="logo-text">THE BENJI HQ</div></header>

    <nav class="sidebar">
        <div class="nav-item active" onclick="showSection('tickets')">Tickets</div>
        <div class="nav-item" onclick="showSection('transfer')">Transfer Items</div>
        <div class="nav-item" onclick="showSection('inventory')">Inventory</div>
        <a href="index.html" class="nav-item" style="color: #ef4444;">Logout</a>
    </nav>

    <main class="main-content">
        <div id="section-tickets" class="admin-box">
            <h2>Pending Tickets</h2>
            <div id="ticket-list">Loading tickets...</div>
            <hr style="border: 0; border-top: 1px solid #27272a; margin: 20px 0;">
            <label>Meeting Instructions</label>
            <input type="text" id="meet-instr" placeholder="e.g. Meet at Server 5, Warehouse Alpha...">
            <button class="btn" onclick="sendInstruction()">Send Instructions</button>
        </div>

        <div id="section-transfer" class="admin-box" style="display:none;">
            <h2>Transfer Items</h2>
            <label>Item</label>
            <select id="t-item">
                <option value="Tuna">Tuna</option>
                <option value="Pastry Dough">Pastry Dough</option>
                <option value="Beans">Beans</option>
                <option value="Peppers">Peppers</option>
            </select>
            <label>From</label>
            <select id="t-from">
                <option>Cantermange Warehouse</option><option>Cantermange Farmhouse</option>
                <option>Bueval Warehouse</option><option>Bueval Farmhouse</option>
                <option>Ellesmare Warehouse</option><option>Ellesmare Fishing Shack</option>
            </select>
            <label>To</label>
            <select id="t-to">
                <option>Cantermange Warehouse</option><option>Cantermange Farmhouse</option>
                <option>Bueval Warehouse</option><option>Bueval Farmhouse</option>
                <option>Ellesmare Warehouse</option><option>Ellesmare Fishing Shack</option>
            </select>
            <button class="btn" onclick="submitTransfer()">Generate Transfer Ticket</button>
        </div>

        <div id="section-inventory" class="admin-box" style="display:none;">
            <h2>Global Inventory</h2>
            <p>View stock levels across all your mapped warehouses here.</p>
        </div>
    </main>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1519403301374787666/CDzN1oODxyQA4zQeCidemB58d4bjVwtFU8XfCPZwW4zBlnuhjKmXSDt7oyZ7GYhBjdxJ";

        function showSection(id) {
            document.querySelectorAll('.admin-box').forEach(b => b.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('section-' + id).style.display = 'block';
            event.currentTarget.classList.add('active');
        }

        async function submitTransfer() {
            const data = {
                item: document.getElementById('t-item').value,
                from: document.getElementById('t-from').value,
                to: document.getElementById('t-to').value
            };

            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{ title: "🚛 Warehouse Transfer Ticket", color: 3066993, fields: [
                        { name: "Item", value: data.item, inline: true },
                        { name: "Origin", value: data.from, inline: false },
                        { name: "Destination", value: data.to, inline: false }
                    ]}]
                })
            });
            alert("Transfer ticket sent to Discord!");
        }
    </script>
</body>
</html>
