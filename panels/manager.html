<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Management Terminal</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0c0e; color: #f0f2f5; padding: 40px; margin: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1100px; margin: 0 auto; }
        .card { background: #141619; border: 1px solid #22252a; border-radius: 6px; padding: 28px; }
        h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px 0; color: #ffffff; }
        .subtitle { font-size: 13px; color: #707782; margin-bottom: 20px; }
        .stock-row { display: flex; justify-content: space-between; padding: 12px; background: #0b0c0e; border: 1px solid #2c3036; border-radius: 4px; margin-bottom: 8px; font-size: 14px; }
        .stock-val { color: #ffffff; font-weight: 600; }
        .ticket-box { background: #0b0c0e; border: 1px solid #2c3036; border-radius: 4px; padding: 16px; font-size: 13px; line-height: 1.6; }
        .ticket-title { font-weight: 600; color: #ff6a00; margin-bottom: 8px; }
        .btn-group { display: flex; gap: 8px; margin-top: 16px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; text-transform: uppercase; }
        .btn-approve { background: #ff6a00; color: #ffffff; }
        .btn-approve:hover { background: #e05d00; }
        .btn-reject { background: rgba(248, 81, 73, 0.1); color: #f85149; border: 1px solid #f85149; }
        .btn-reject:hover { background: #f85149; color: #ffffff; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="card">
            <h2>Warehouse Stock</h2>
            <div class="subtitle">Current materials registered inside storage blocks.</div>
            <div class="stock-row"><span>Tuna</span><span id="st-tuna" class="stock-val">0</span></div>
            <div class="stock-row"><span>Salt</span><span id="st-salt" class="stock-val">0</span></div>
            <div class="stock-row"><span>Beans</span><span id="st-beans" class="stock-val">0</span></div>
            <div class="stock-row"><span>Peppers</span><span id="st-peppers" class="stock-val">0</span></div>
        </div>

        <div class="card">
            <h2>Pending Forms</h2>
            <div class="subtitle">Review active resource drop submissions.</div>
            <div class="ticket-box" id="activeTicket">
                <div class="ticket-title">Ticket #8849</div>
                <div>Origin: <strong>W_FISH_04 (Fisher)</strong></div>
                <div>Quantity: <strong>50 Tuna</strong></div>
                <div class="btn-group">
                    <button class="btn btn-approve" onclick="actionTicket(true)">Approve</button>
                    <button class="btn btn-reject" onclick="actionTicket(false)">Reject</button>
                </div>
            </div>
            <p id="emptyMsg" style="color: #707782; font-size: 13px; text-align: center; margin: 20px 0; display: none;">No incoming tickets present.</p>
        </div>
    </div>

    <script src="../api.js"></script>
    <script>
        function actionTicket(approved) {
            if (approved) {
                document.getElementById('st-tuna').innerText = "50";
                alert("Supplies routed to warehouse reserves.");
            } else {
                alert("Log request rejected.");
            }
            document.getElementById('activeTicket').style.display = 'none';
            document.getElementById('emptyMsg').style.display = 'block';
        }
    </script>
</body>
</html>
