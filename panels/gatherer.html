<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benji HQ | Gatherer Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #09090b; color: #f4f4f5; display: flex; min-height: 100vh; }

    .sidebar { width: 260px; background: #18181b; border-right: 1px solid #27272a; padding: 22px 0; display: flex; flex-direction: column; }
    .logo { padding: 0 18px 18px; border-bottom: 1px solid #27272a; }
    .logo .badge { display:inline-block; border:1px solid #f97316; color:#f97316; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:700; margin-bottom:8px; text-transform:uppercase; }
    .logo h1 { font-size:24px; font-weight:900; }
    .logo p { color:#a1a1aa; font-size:12px; margin-top:6px; }

    .nav { padding:14px; display:flex; flex-direction:column; gap:8px; }
    .nav button { background:transparent; border:none; color:#a1a1aa; text-align:left; padding:12px; border-radius:6px; cursor:pointer; font-weight:700; }
    .nav button:hover { background:#27272a; color:#fff; }
    .nav button.active { background:#27272a; color:#f97316; }

    .logout { margin-top:auto; padding:14px; border-top:1px solid #27272a; }
    .logout button { width:100%; background:#27272a; border:1px solid #3f3f46; color:#a1a1aa; border-radius:6px; padding:10px; font-weight:700; cursor:pointer; }

    .main { flex:1; padding:30px; overflow:auto; }
    .view { display:none; }
    .view.active { display:block; }

    .header { margin-bottom:20px; }
    .header h2 { font-size:28px; font-weight:900; }
    .header p { color:#a1a1aa; margin-top:6px; }

    .card { background:#141619; border:1px solid #22252a; border-radius:8px; padding:20px; margin-bottom:16px; }

    label { display:block; font-size:11px; text-transform:uppercase; color:#a1a1aa; font-weight:700; margin-bottom:6px; }
    input, select { width:100%; background:#0b0c0e; border:1px solid #2c3036; color:#fff; border-radius:6px; padding:11px; margin-bottom:12px; outline:none; }
    input:focus, select:focus { border-color:#f97316; box-shadow:0 0 0 1px #f97316; }

    .btn { border:none; background:#f97316; color:#000; padding:10px 12px; border-radius:6px; font-weight:900; cursor:pointer; }
    .btn:hover { background:#ea580c; color:#fff; }

    table { width:100%; border-collapse:collapse; background:#0b0c0e; border-radius:8px; overflow:hidden; }
    th, td { padding:12px; border-bottom:1px solid #27272a; text-align:left; font-size:13px; color:#d4d4d8; }
    th { color:#f97316; font-size:11px; text-transform:uppercase; font-weight:800; }
    tr:last-child td { border-bottom:none; }

    .total { font-size:22px; font-weight:900; color:#f97316; margin-top:6px; }
    .sidebar-logo-wrap{
  padding: 0 16px 16px;
  margin: 0 0 14px;
  border-bottom: 1px solid #27272a;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.sidebar-logo-img{
  width: 170px;
  max-width: 100%;
  height: auto;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,.35);
}
.sidebar-logo-ver{
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: #f97316;
}
.sidebar-panel-name{
  font-size: 12px;
  color: #a1a1aa;
}

  </style>
</head>
<body>
  <aside class="sidebar">
<div class="sidebar-logo-wrap">
  <img class="sidebar-logo-img" src="../The%20Benji%20HQ%20V2.png" alt="The Benji HQ V2">
  <div class="sidebar-logo-ver">Community Hub v2.0</div>
  <div class="sidebar-panel-name">Gatherer Panel</div>
</div>


    <div class="nav">
      <button class="active" onclick="switchView('view-transfer', this)">📦 Transfer to Manager</button>
      <button onclick="switchView('view-stock', this)">📊 My Stock</button>
      <button onclick="switchView('view-history', this)">🧾 My Tickets</button>
    </div>

    <div class="logout">
      <button onclick="window.location.href='../front side/index.html'">LOG OUT</button>
    </div>
  </aside>

  <main class="main">
    <section id="view-transfer" class="view active">
      <div class="header">
        <h2>Transfer Ticket</h2>
        <p>Items: Butter, Salt, Pastry Dough, Flour (auto price calculation).</p>
      </div>

      <div class="card">
        <label>Item</label>
        <select id="item" onchange="calcTotal()"></select>

        <label>Amount</label>
        <input id="amount" type="number" min="1" value="1" oninput="calcTotal()" />

        <label>From</label>
        <input value="Inventory" readonly />

        <label>To Warehouse</label>
        <select id="to-location"></select>

        <label>Unit Price</label>
        <input id="unit-price" readonly />

        <label>Total Pay</label>
        <input id="total-price" readonly />

        <div class="total" id="total-label">Total: 0p</div>
        <button class="btn" onclick="submitTransfer()">Submit Transfer</button>
      </div>
    </section>

    <section id="view-stock" class="view">
      <div class="header">
        <h2>My Personal Stock</h2>
        <p>You can only update your own stock.</p>
      </div>

      <div class="card">
        <label>Butter</label>
        <input id="stock-butter" type="number" min="0" />
        <label>Salt</label>
        <input id="stock-salt" type="number" min="0" />
        <label>Pastry Dough</label>
        <input id="stock-dough" type="number" min="0" />
        <label>Flour</label>
        <input id="stock-flour" type="number" min="0" />
        <button class="btn" onclick="saveMyStock()">Save My Stock</button>
      </div>
    </section>

    <section id="view-history" class="view">
      <div class="header">
        <h2>My Transfer Tickets</h2>
        <p>Owner approval status appears here.</p>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Ticket</th>
              <th>Item</th>
              <th>Amount</th>
              <th>Pay</th>
              <th>To</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const STORAGE = {
      tickets: "benji_transfer_tickets",
      transferWebhook: "benji_transfer_webhook",
      gathererStock: "benji_gatherer_stock_by_user"
    };

    const PRICES = {
      "Butter": 10,
      "Salt": 5,
      "Pastry Dough": 15,
      "Flour": 5
    };

    const TO_LOCATIONS = [
      "Cantermange Warehouse",
      "Cantermange Farmhouse",
      "Bueval Warehouse",
      "Bueval Farmhouse",
      "Ellesmare Warehouse",
      "Ellesmare Fish Hut"
    ];

    const gathererName = localStorage.getItem("benji_active_seller_name") || "Gatherer";

    function readJSON(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch { return fallback; }
    }

    function writeJSON(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function switchView(id, btn) {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      btn.classList.add("active");
      if (id === "view-stock") loadMyStock();
      if (id === "view-history") renderHistory();
    }

    function setup() {
      document.getElementById("g-name").textContent = gathererName;

      const itemSel = document.getElementById("item");
      Object.entries(PRICES).forEach(([name, p]) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = `${name} - ${p}p`;
        itemSel.appendChild(opt);
      });

      const toSel = document.getElementById("to-location");
      TO_LOCATIONS.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        toSel.appendChild(opt);
      });

      calcTotal();
    }

    function calcTotal() {
      const item = document.getElementById("item").value;
      const amount = Math.max(1, Number(document.getElementById("amount").value || 1));
      const unit = PRICES[item] || 0;
      const total = unit * amount;

      document.getElementById("unit-price").value = `${unit}p`;
      document.getElementById("total-price").value = `${total.toLocaleString()}p`;
      document.getElementById("total-label").textContent = `Total: ${total.toLocaleString()}p`;
    }

    async function sendWebhook(ticket) {
      const url = localStorage.getItem(STORAGE.transferWebhook) || "";
      if (!url) return;
      try {
        await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            embeds: [{
              title: `📦 Gatherer Transfer Ticket (${ticket.id})`,
              color: 16753920,
              fields: [
                { name: "Discord Username", value: ticket.requesterUsername, inline: true },
                { name: "Role", value: ticket.requesterRole, inline: true },
                { name: "Item", value: ticket.item, inline: true },
                { name: "Amount", value: String(ticket.amount), inline: true },
                { name: "Pay", value: `${ticket.totalPrice.toLocaleString()}p`, inline: true },
                { name: "From", value: ticket.fromLocation, inline: true },
                { name: "To", value: ticket.toLocation, inline: true }
              ],
              timestamp: new Date().toISOString()
            }]
          })
        });
      } catch (e) {
        console.warn("Webhook failed", e);
      }
    }

    async function submitTransfer() {
      const item = document.getElementById("item").value;
      const amount = Math.max(1, Number(document.getElementById("amount").value || 1));
      const toLocation = document.getElementById("to-location").value;
      const unitPrice = PRICES[item] || 0;
      const totalPrice = unitPrice * amount;

      const ticket = {
        id: `TR-${Math.floor(100000 + Math.random() * 900000)}`,
        requesterUsername: gathererName,
        requesterRole: "Gatherer",
        item,
        amount,
        unitPrice,
        totalPrice,
        fromLocation: "Inventory",
        toLocation,
        notes: "",
        status: "Pending",
        createdAt: new Date().toISOString()
      };

      const tickets = readJSON(STORAGE.tickets, []);
      tickets.push(ticket);
      writeJSON(STORAGE.tickets, tickets);

      await sendWebhook(ticket);
      alert(`Ticket ${ticket.id} created.`);
      renderHistory();
    }

    function loadMyStock() {
      const byUser = readJSON(STORAGE.gathererStock, {});
      const mine = byUser[gathererName] || { Butter: 0, Salt: 0, "Pastry Dough": 0, Flour: 0 };

      document.getElementById("stock-butter").value = mine.Butter || 0;
      document.getElementById("stock-salt").value = mine.Salt || 0;
      document.getElementById("stock-dough").value = mine["Pastry Dough"] || 0;
      document.getElementById("stock-flour").value = mine.Flour || 0;
    }

    function saveMyStock() {
      const byUser = readJSON(STORAGE.gathererStock, {});
      byUser[gathererName] = {
        Butter: Math.max(0, Number(document.getElementById("stock-butter").value || 0)),
        Salt: Math.max(0, Number(document.getElementById("stock-salt").value || 0)),
        "Pastry Dough": Math.max(0, Number(document.getElementById("stock-dough").value || 0)),
        Flour: Math.max(0, Number(document.getElementById("stock-flour").value || 0))
      };
      writeJSON(STORAGE.gathererStock, byUser);
      alert("Your stock was updated.");
    }

    function renderHistory() {
      const tbody = document.getElementById("history-body");
      const mine = readJSON(STORAGE.tickets, []).filter(t => t.requesterUsername === gathererName && t.requesterRole === "Gatherer");

      if (!mine.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:#a1a1aa;">No tickets yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = [...mine].reverse().map(t => `
        <tr>
          <td style="font-family:monospace">${t.id}</td>
          <td>${t.item}</td>
          <td>${t.amount}</td>
          <td>${Number(t.totalPrice || 0).toLocaleString()}p</td>
          <td>${t.toLocation}</td>
          <td>${t.status}</td>
        </tr>
      `).join("");
    }

    window.onload = () => {
      setup();
      loadMyStock();
      renderHistory();
    };
  </script>
</body>
</html>
