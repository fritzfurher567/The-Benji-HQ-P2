<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Benji HQ | Gatherer Terminal</title>
    <style>
        /* --- GLOBAL STYLES --- */
        body { background: #09090b; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; display: flex; }

        /* --- TOP NAV (LOGO) --- */
        .top-navbar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: #0a0a0a; border-bottom: 2px solid #f97316; display: flex; align-items: center; padding: 0 30px; z-index: 1000; }
        .logo-text { color: white; font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; }

        /* --- LEFT SIDEBAR --- */
        .sidebar { position: fixed; top: 70px; left: 0; width: 250px; height: calc(100vh - 70px); background: #141619; border-right: 1px solid #27272a; padding: 20px; }
        .nav-item { display: block; padding: 15px; color: #a1a1aa; text-decoration: none; font-weight: bold; border-radius: 4px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .nav-item:hover { background: #18181b; color: #fff; border-color: #3f3f46; }
        .nav-item.active { background: #f97316; color: #000; }

        /* --- MAIN CONTENT --- */
        .main-content { margin-top: 70px; margin-left: 250px; padding: 40px; width: 100%; max-width: 800px; }
        .admin-box { background: #141619; border: 1px solid #27272a; padding: 25px; border-radius: 8px; margin-bottom: 20px; }

        /* --- INPUTS & BUTTONS --- */
        label { display: block; font-size: 11px; font-weight: bold; color: #f97316; margin-bottom: 8px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; background: #0b0c0e; border: 1px solid #3f3f46; color: white; border-radius: 4px; margin-bottom: 15px; }
        .btn { background: #f97316; color: #000; padding: 12px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn:hover { background: #ea580c; color: white; }
    </style>
</head>
<body>

    <header class="top-navbar">
        <div class="logo-text">THE BENJI HQ</div>
    </header>

    <nav class="sidebar">
        <div class="nav-item active" onclick="showSection('transfer')">Transfer To Manager</div>
        <div class="nav-item" onclick="showSection('stock')">Update Stock</div>
        <div class="nav-item" onclick="showSection('market')">Buy Butter</div>
        <a href="index.html" class="nav-item" style="color: #ef4444;">Logout</a>
    </nav>

    <main class="main-content">
        <div id="section-transfer" class="admin-box">
            <h2>Transfer To Manager</h2>
            <label>Item</label>
            <select id="transfer-item">
                <option value="Salt">Salt (Sell at 15p)</option>
                <option value="Pastry Dough">Pastry Dough (Sell at 50p)</option>
            </select>
            <label>Quantity</label>
            <input type="number" id="transfer-qty" placeholder="0">
            <button class="btn" onclick="processAction('transfer')">Submit Transfer</button>
        </div>

        <div id="section-stock" class="admin-box" style="display:none;">
            <h2>Update/View Stock</h2>
            <p>Current Inventory:</p>
            <ul>
                <li>Salt: <span id="stock-salt">0</span></li>
                <li>Butter: <span id="stock-butter">0</span></li>
                <li>Pastry Dough: <span id="stock-dough">0</span></li>
            </ul>
        </div>

        <div id="section-market" class="admin-box" style="display:none;">
            <h2>Buy Butter (20p/unit)</h2>
            <label>Quantity</label>
            <input type="number" id="market-qty" placeholder="0">
            <button class="btn" onclick="processAction('market')">Purchase</button>
        </div>
    </main>

    <script>
    // 1. ADD YOUR SHARED WEBHOOK HERE
    const SHARED_WEBHOOK_URL = "https://discord.com/api/webhooks/1519403301374787666/CDzN1oODxyQA4zQeCidemB58d4bjVwtFU8XfCPZwW4zBlnuhjKmXSDt7oyZ7GYhBjdxJ";

    // Navigation Toggle
    function showSection(id) {
        document.querySelectorAll('.admin-box').forEach(b => b.style.display = 'none');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('section-' + id).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    // Shared Function to send to Discord
    async function sendToDiscord(title, fields) {
        const payload = {
            embeds: [{
                title: title,
                color: 16345622, // Orange color
                fields: fields,
                footer: { text: "Benji HQ | Staff Terminal" },
                timestamp: new Date().toISOString()
            }]
        };

        try {
            await fetch(SHARED_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert("Action logged successfully!");
        } catch (err) {
            console.error(err);
            alert("Failed to send to Discord.");
        }
    }

    // Processing Actions
    async function processAction(type) {
        if (type === 'transfer') {
            const item = document.getElementById('transfer-item').value;
            const qty = document.getElementById('transfer-qty').value;
            sendToDiscord("📦 New Transfer Request", [
                { name: "Item", value: item, inline: true },
                { name: "Quantity", value: qty, inline: true }
            ]);
        }
        else if (type === 'market') {
            const qty = document.getElementById('market-qty').value;
            sendToDiscord("🧈 New Market Order", [
                { name: "Item", value: "Butter", inline: true },
                { name: "Quantity", value: qty, inline: true },
                { name: "Total Cost", value: (qty * 20) + "p", inline: true }
            ]);
        }
    }
</script>
</body>
</html>
